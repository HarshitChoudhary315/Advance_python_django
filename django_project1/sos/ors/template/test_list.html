<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% include 'header.html' %}
<form>
    <div align="center">
        <h1> Test List</h1>
        <table border="1" width="100%">
            <tr>
                <th>Id</th>
                <th>FIRST NAME</th>
                <th>LAST NAME</th>
                <th>EMAIL</th>
                <th>PASSWORD</th>
            </tr>
            {% for l in list %}
            <tr align="center">
             <td>{{ l.id }}</td>
             <td>{{ l.first_name}}</td>
             <td>{{ l.last_name}}</td>
             <td>{{ l.email }}</td>
             <td>{{ l.password}}</td>
            </tr>
            {% endfor %}

        </table>
    </div>
</form>
</body>
</html>
