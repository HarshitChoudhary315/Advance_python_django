<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% include 'header.html' %}

    {% csrf_token %}
    <div align="center">
        <table>
            <h1>REGISTRATION</h1>
        <tr>
            <th>first name :</th>
            <td><input type="text" name="firstName"></td>
        </tr>
            <tr>
            <th>last name :</th>
            <td><input type="text" name="lastName"></td>
        </tr>
            <tr>
            <th>login Id :</th>

        </tr>
            <tr>
            <th>password :</th>

        </tr>
            <tr>
            <th>dob :</th>
            <td><input type="text" name="dob"></td>
        </tr>
            <tr>
            <th>address :</th>
            <td><input type="text" name="address"></td>
        </tr>
            <tr>
            <th></th>

        </table>
    </div>

</html>
